<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1: Inline Style (CSS Nội tuyến)</title>
</head>
<body>

    <!-- Phần 1: Thay đổi màu sắc văn bản sử dụng Inline Style (style attribute) -->
    <h1 style="color: #2563eb; font-family: sans-serif;">Tiêu đề trang web - Inline Style</h1>
    <p style="color: #dc2626; font-size: 18px; font-family: sans-serif;">Đây là đoạn văn bản được thay đổi màu sắc bằng cách sử dụng thuộc tính inline-style (style="color: ...").</p>

</body>
</html>
