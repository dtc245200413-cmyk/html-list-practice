<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang Giới thiệu - Bài tập thực hành liên kết HTML (thẻ a)">
    <title>Giới thiệu - Liên kết yêu thích của tôi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-card: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-glow);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #c084fc;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #ffffff;
            text-decoration: none;
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👨‍💻</div>
        <h1>Giới thiệu về tôi</h1>
        <p>Chào mừng bạn đến với trang giới thiệu! Đây là file HTML phụ (about.html) được liên kết nội bộ từ trang chủ (index.html) để thực hành bài tập điều hướng thẻ anchor trong HTML.</p>
        <a href="index.html" class="back-btn">⬅️ Quay lại Trang Chủ (index.html)</a>
    </div>
</body>
</html>
