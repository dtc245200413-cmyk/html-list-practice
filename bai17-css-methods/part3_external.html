<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 3: External Style (CSS Ngoại tuyến)</title>
    <!-- Phần 3: Thêm file CSS bên ngoài sử dụng thẻ <link> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tiêu đề trang web - External Style</h1>
    <p>Đây là đoạn văn bản được thay đổi màu sắc bằng cách sử dụng file external-style (style.css được nhúng qua thẻ &lt;link&gt;).</p>

</body>
</html>
