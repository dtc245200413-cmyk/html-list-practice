<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyWebsite</div>

    </nav>

    <main style="padding: 40px 20px; text-align: center;">
        <h1>Chào mừng bạn đến với MyWebsite</h1>
        <p style="margin-top: 15px; color: #64748b;">Hãy thu nhỏ kích thước cửa sổ trình duyệt (dưới 768px) để kiểm tra giao diện Responsive và nút Hamburger menu (☰).</p>
