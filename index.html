<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bài tập thực hành HTML CSS nội tuyến (style attribute) - Định dạng màu sắc, font chữ, căn chỉnh và gạch chân.">
    <title>Bài viết của tôi - Thực hành HTML Styles</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-card: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.15) 0%, transparent 45%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .tag {
            align-self: center;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            padding: 0.35rem 1.1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 0.5rem;
        }

        .p-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            transition: transform 0.25s ease;
        }

        .p-box:hover {
            transform: translateY(-2px);
            background: rgba(15, 23, 42, 0.7);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <main class="card">
            <span class="tag">Bài Thực Hành HTML Inline CSS</span>

            <!-- Yêu cầu 1: h1 có màu xanh dương (color: blue) -->
            <h1 style="color: blue; text-align: center; margin-bottom: 1rem; font-size: 2.2rem; font-weight: 800;">Bài viết của tôi</h1>

            <!-- Yêu cầu 2: p có màu đỏ và chữ in đậm (color: red; font-weight: bold;) -->
            <div class="p-box">
                <p style="color: red; font-weight: bold; margin: 0; font-size: 1.1rem;">Đây là đoạn văn được định dạng màu sắc</p>
            </div>

            <!-- Yêu cầu 3: p có chữ in nghiêng và căn giữa (font-style: italic; text-align: center;) -->
            <div class="p-box">
                <p style="font-style: italic; text-align: center; margin: 0; font-size: 1.1rem; color: #cbd5e1;">Tôi đang học HTML Styles</p>
            </div>

            <!-- Yêu cầu 4: p có kích thước chữ 20px và gạch chân (font-size: 20px; text-decoration: underline;) -->
            <div class="p-box">
                <p style="font-size: 20px; text-decoration: underline; margin: 0; color: #38bdf8;">Định dạng văn bản giúp trang web đẹp hơn</p>
            </div>
        </main>

        <footer>
            <p>Bài tập thực hành HTML • Định dạng văn bản với CSS Inline Style</p>
        </footer>
    </div>

</body>
</html>
