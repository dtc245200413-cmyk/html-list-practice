<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Order Form</title>
    <style>
        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
        }

        /* Styling to elevate appearance while preserving original form markup */
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        form.wufoo {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
            font-size: 24px;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 10px;
        }

        p {
            font-weight: 600;
            color: #334155;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            background-color: #f8fafc;
            cursor: pointer;
        }

        input[type="text"] {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            margin-right: 5px;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
        }

        input[type="button"] {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        input[type="button"]:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <form method="get" action="simpleform.html" class="wufoo">
        <h2>Order Form</h2>
        
        <p>What would you like to buy?</p>
        <select>
            <option value="  ">A</option>
            <option>B (+  0.5$)</option>
            <option>C (+  0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <input type="radio" name="rd"/> 1 - $10 <br/>
        <input type="radio" name="rd"/> 2 - $20 <br/>
        <input type="radio" name="rd"/> 3 - $25 <br/>

        <p>Name <span style="color: red">*</span> </p>
        <input type="text" name="firstname" placeholder="FirstName" size="15"/>
        <input type="text" name="lastname" placeholder="LastName" size="15"/>

        <p>Email</p>
        <input type="text" name="email" size="35"/>

        <p>Phone Number</p>
        <input type="text" name="phone1" size="5"/> -
        <input type="text" name="phone2" size="5"/> -
        <input type="text" name="phone3" size="5"/>

        <p><input type="button" name="btSubmit" value="Submit"/></p>
    </form>

</body>
</html>
