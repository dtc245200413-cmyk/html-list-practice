<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng Bootstrap 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="card-title text-center fw-bold text-primary mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>

                        <form action="#" method="POST">
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-bold">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi cam kết bảo mật địa chỉ email của bạn.</div>
                            </div>

                            <!-- 3. Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Tối thiểu 8 ký tự" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label fw-bold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirm_password" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding" checked>
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-bold">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" disabled selected>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản (Japan)</option>
                                    <option value="KR">Hàn Quốc (South Korea)</option>
                                    <option value="SG">Singapore</option>
                                </select>
                            </div>

                            <!-- 8. Nút Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký Ngay</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
