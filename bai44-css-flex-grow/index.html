<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuộc Tính flex-grow Trong CSS Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực Hành Thuộc Tính <code>flex-grow</code></h1>

    <section class="example-section">
        <h2>Minh Họa 5 Thẻ DIV (Thẻ thứ 2 áp dụng <code>flex-grow: 3</code>)</h2>
        <p class="sub-desc">Thẻ thứ 2 sẽ tự động phát triển (giãn ra) chiếm nhiều khoảng trống thừa hơn 4 thẻ còn lại trong cùng container:</p>
        
        <div class="flex-container">
            <div class="item">Item 1</div>
            <div class="item item-grow-2">Item 2 (flex-grow: 3)</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
            <div class="item">Item 5</div>
        </div>
    </section>
</body>
</html>
