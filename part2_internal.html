<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2: Internal Style (CSS Nội bộ)</title>
    <!-- Phần 2: Thay đổi màu sắc văn bản sử dụng thẻ <style> trong <head> -->
    <style>
        h1 {
            color: #9333ea;
            font-family: sans-serif;
        }

        p {
            color: #059669;
            font-size: 18px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <h1>Tiêu đề trang web - Internal Style</h1>
    <p>Đây là đoạn văn bản được thay đổi màu sắc bằng cách sử dụng thẻ internal-style (&lt;style&gt; trong thẻ &lt;head&gt;).</p>

</body>
</html>
