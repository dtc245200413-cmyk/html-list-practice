<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Responsive Image Gallery</h2>
    <p class="description">Thay đổi kích thước cửa sổ trình duyệt để xem hiệu ứng Media Query (4 ảnh -> 2 ảnh -> 1 ảnh trên một dòng).</p>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Ảnh 1">
            <div class="desc">Thêm mô tả cho ảnh 1</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Ảnh 2">
            <div class="desc">Thêm mô tả cho ảnh 2</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=3" alt="Ảnh 3">
            <div class="desc">Thêm mô tả cho ảnh 3</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Ảnh 4">
            <div class="desc">Thêm mô tả cho ảnh 4</div>
        </div>
    </div>
</body>
</html>
